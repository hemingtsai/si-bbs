# Reverse proxy in front of the SI BBS all-in-one binary.
# Usage:
#   docker run -p 3000:3000 ...          # no nginx needed
#   or point this at the binary's address instead.
server {
    listen 80;
    server_name _;

    # Precompressed assets generated by the Vite build (.br/.gz siblings).
    gzip_static on;

    # Built-in Brotli/Zstd compression is handled by the backend itself, so we
    # only need to stream through to it.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # A small in-process cache for the static bundle is handled by the binary;
    # nothing more to configure here.
}
