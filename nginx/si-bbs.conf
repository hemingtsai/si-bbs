# Reverse proxy / static front end for the SI BBS all-in-one binary.
#
# Two supported shapes:
#
#   1. Let the binary serve everything. Proxy every request (no `root`); the
#      binary sets the security headers itself, serves the `.br`/`.gz` siblings,
#      and falls back to index.html for client-side routes. For that, drop the
#      `root` and `location /assets/` blocks below and keep a single
#      `location / { proxy_pass http://127.0.0.1:3000; }`.
#
#   2. Let nginx serve the SPA files itself (the shape below). This is the only
#      shape where `gzip_static` does anything: it applies to files nginx reads
#      from disk, never to proxied responses. Brotli needs the ngx_brotli module
#      (`brotli_static on;`).
#
# Without `try_files … /index.html`, refreshing /forum/1 returned the API's JSON
# 404: the path was proxied to the backend, which has no SPA fallback when
# STATIC_DIR is unset.
server {
    listen 80;
    server_name _;

    root /srv/si-bbs/dist;
    index index.html;

    gzip_static on;
    # axum's own default body limit; stop the proxy from rejecting first.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Content-hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "accept-encoding" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri =404;
    }

    # SPA deep links: unknown paths get the shell, not a 404.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Vary "accept-encoding" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri /index.html;
    }
}
